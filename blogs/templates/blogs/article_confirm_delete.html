<!DOCTYPE html>
<html>
<head>
    <title>Удаление статью</title>
    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Удаление статью</h1>
        <p>Вы уверены, что хотите удалить "{{ article.title_article }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blogs:article_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
    <script type="text/javascript" src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
